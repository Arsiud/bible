<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bible</title>
  <meta name="theme-color" content="#6b4a2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bible">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Table of contents">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 id="title">Bible</h1>
    <button id="bookmarkBtn" class="icon-btn" aria-label="Bookmark this spot">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button id="translationBtn" class="pill-btn" aria-haspopup="menu">KJV</button>
  </header>

  <main>
    <section id="bibleView" class="view">
      <article id="chapter" class="chapter"></article>
    </section>
    <section id="bookmarksView" class="view" hidden>
      <div id="bookmarks" class="list-page"></div>
    </section>
    <section id="connectionView" class="view" hidden>
      <div class="empty">
        <svg viewBox="0 0 24 24" width="48" height="48"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 19c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5M15 14.2c2.6-.4 5.2.9 6 4.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <h2>Connection</h2>
        <p>Coming soon.</p>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="bibleView">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Bible</span>
    </button>
    <button class="tab" data-view="bookmarksView">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Bookmarks</span>
    </button>
    <button class="tab" data-view="connectionView">
      <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 19c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5M15 14.2c2.6-.4 5.2.9 6 4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Connection</span>
    </button>
  </nav>

  <!-- Table of contents drawer -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <button id="drawerBack" class="text-btn" hidden>‹ Books</button>
      <h2 id="drawerTitle">Books</h2>
      <button id="drawerClose" class="text-btn">Close</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <!-- Translation menu -->
  <div id="translationMenu" class="popover" role="menu" hidden></div>

  <!-- Settings -->
  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label for="esvKey">ESV API key</label>
      <input id="esvKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key">
      <p class="hint">Get a free key at <a href="https://api.esv.org/" target="_blank" rel="noopener">api.esv.org</a> for personal, non-commercial use. It's saved only on this device.</p>
      <button class="primary-btn">Done</button>
    </form>
  </dialog>

  <!-- Name or edit a bookmark -->
  <dialog id="bookmarkDialog">
    <form method="dialog">
      <h2 id="bookmarkDialogTitle">Save bookmark</h2>
      <p id="bookmarkRef" class="hint"></p>
      <label for="bookmarkName">Name</label>
      <input id="bookmarkName" autocomplete="off" placeholder="e.g. Morning reading" required>
      <label for="bookmarkNotes" class="spaced">Notes</label>
      <textarea id="bookmarkNotes" rows="5" placeholder="Optional"></textarea>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate class="secondary-btn">Cancel</button>
        <button value="save" class="primary-btn">Save</button>
      </div>
      <button id="bookmarkDelete" value="delete" formnovalidate class="danger-btn">Delete bookmark</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
